{% extends "base.html" %}

{% block title %}
Add Medicine | MEDIXA PHARMA
{% endblock %}

{% block content %}

<div class="page-heading">

    <div>

        <h1>
            Add Medicine
        </h1>

        <p>
            Add basic information for a new medicine.
        </p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label for="name">
                    Medicine Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter medicine name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="medicine_type">
                    Medicine Type
                </label>

                <select
                    id="medicine_type"
                    name="medicine_type"
                    required
                >

                    <option value="">
                        Select type
                    </option>

                    <option value="Tablet">Tablet</option>
                    <option value="Capsule">Capsule</option>
                    <option value="Syrup">Syrup</option>
                    <option value="Injection">Injection</option>
                    <option value="Cream">Cream</option>
                    <option value="Ointment">Ointment</option>
                    <option value="Drops">Drops</option>
                    <option value="Inhaler">Inhaler</option>
                    <option value="Suspension">Suspension</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="form-group">

                <label for="date_added">
                    Added Date
                </label>

                <input
                    type="date"
                    id="date_added"
                    name="date_added"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a href="{{ url_for('inventory') }}"
               class="btn secondary">

                Cancel

            </a>


            <button type="submit"
                    class="btn primary">

                Add Medicine

            </button>

        </div>

    </form>

</div>

{% endblock %}
